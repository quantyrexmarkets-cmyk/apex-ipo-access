<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0f; --bg-elev:#12141b; --bg-elev-2:#181b24;
    --border:rgba(255,255,255,0.06);
    --text:#f5f6fa; --text-dim:#8b90a3; --text-mute:#5a5f72;
    --up:#17e08a; --down:#ff5c5c; --accent:#5b8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0 0 100px;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;font-size:15px;
    -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:"tnum" 1;}

  .topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;
    position:sticky;top:0;z-index:10;background:rgba(10,11,15,0.85);
    backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
  .icon-btn{width:38px;height:38px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;background:var(--bg-elev);
    border:1px solid var(--border);color:var(--text);cursor:pointer;}
  .topbar-title{flex:1;font-weight:600;font-size:15px;text-align:center;
    display:flex;align-items:center;gap:8px;justify-content:center;}
  .paper-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
    background:rgba(91,140,255,0.12);border:1px solid rgba(91,140,255,0.3);
    border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--accent);}
  .paper-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  .segmented{margin:16px 20px;padding:4px;background:var(--bg-elev);
    border:1px solid var(--border);border-radius:12px;display:flex;gap:2px;}
  .seg{flex:1;padding:10px;border:none;background:transparent;color:var(--text-dim);
    font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;}
  .seg.active{background:var(--bg-elev-2);color:var(--text);}

  .empty{padding:60px 20px;text-align:center;color:var(--text-mute);font-size:14px;}
  .empty svg{width:48px;height:48px;margin-bottom:12px;opacity:0.4;}

  .orders-list{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
  .order-card{padding:14px;background:var(--bg-elev);border:1px solid var(--border);
    border-radius:12px;}
  .order-row1{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .order-logo{width:32px;height:32px;border-radius:8px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;
    font-weight:700;color:#000;flex-shrink:0;}
  .order-logo img{width:100%;height:100%;object-fit:contain;}
  .order-title{flex:1;min-width:0;}
  .order-ticker{font-weight:700;font-size:14px;}
  .order-meta{font-size:11px;color:var(--text-dim);margin-top:2px;
    text-transform:uppercase;letter-spacing:0.05em;}
  .order-status{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.05em;}
  .status-pending{background:rgba(255,193,7,0.15);color:#ffc107;}
  .status-filled{background:rgba(23,224,138,0.15);color:var(--up);}
  .status-cancelled{background:rgba(139,144,163,0.15);color:var(--text-dim);}
  .status-rejected,.status-expired{background:rgba(255,92,92,0.15);color:var(--down);}

  .order-row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding-top:10px;
    border-top:1px solid var(--border);}
  .order-cell{}
  .order-label{font-size:10px;color:var(--text-mute);text-transform:uppercase;
    letter-spacing:0.08em;margin-bottom:3px;font-weight:600;}
  .order-value{font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;}

  .cancel-btn{margin-top:12px;width:100%;padding:10px;background:transparent;
    border:1px solid var(--border);color:var(--down);
    font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;
    cursor:pointer;transition:.15s;}
  .cancel-btn:active{transform:scale(0.97);background:rgba(255,92,92,0.08);}
  .cancel-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .side-buy{color:var(--up);}
  .side-sell{color:var(--down);}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
    padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
    background:var(--bg-elev-2);border:1px solid var(--border);
    opacity:0;pointer-events:none;transition:.3s;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{color:var(--up);border-color:rgba(23,224,138,0.4);}
  .toast.error{color:var(--down);border-color:rgba(255,92,92,0.4);}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="location.href='/dashboard'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title">Orders</div>
  <button class="icon-btn" onclick="loadOrders()" aria-label="Refresh">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
</div>

<div class="segmented">
  <button class="seg active" data-tab="open">Open</button>
  <button class="seg" data-tab="closed">History</button>
</div>

<div id="ordersList" class="orders-list"></div>
<div id="toast" class="toast"></div>

<script>
const fmt = n => Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let currentTab = 'open';

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind||'');
  setTimeout(()=>{ t.className = 'toast'; }, 2400);
}

async function loadOrders(){
  const el = document.getElementById('ordersList');
  el.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch('/api/buy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'order-list', status: currentTab })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Failed');
    renderOrders(j.orders || []);
  } catch(e) {
    el.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}

function renderOrders(orders){
  const el = document.getElementById('ordersList');
  if (!orders.length) {
    el.innerHTML = '<div class="empty">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>'
      + '<div>No ' + currentTab + ' orders</div>'
      + (currentTab === 'open' ? '<div style="margin-top:6px;font-size:12px;">Place a limit order from the Trade page</div>' : '')
      + '</div>';
    return;
  }
  el.innerHTML = orders.map(o => {
    const sideClass = o.side === 'buy' ? 'side-buy' : 'side-sell';
    const statusClass = 'status-' + o.status;
    const size = o.shares ? o.shares.toFixed(4) + ' sh' : '$' + fmt(o.dollarAmount);
    const placed = new Date(o.placedAt).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const logo = o.logoUrl || '/images/logos/' + (o.ticker||'').toLowerCase() + '.png';
    const initial = (o.ticker||'?')[0];
    return `
      <div class="order-card">
        <div class="order-row1">
          <div class="order-logo"><img src="${logo}" alt="" onerror="this.parentNode.textContent='${initial}'"></div>
          <div class="order-title">
            <div class="order-ticker">
              <span class="${sideClass}">${o.side.toUpperCase()}</span> ${o.ticker}
              <span style="color:var(--text-dim);font-weight:500">·</span>
              <span style="color:var(--text-dim);text-transform:uppercase;font-size:11px;font-weight:600">${o.orderType}</span>
            </div>
            <div class="order-meta">${placed}</div>
          </div>
          <div class="order-status ${statusClass}">${o.status.replace('_',' ')}</div>
        </div>
        <div class="order-row2">
          <div class="order-cell">
            <div class="order-label">Size</div>
            <div class="order-value">${size}</div>
          </div>
          <div class="order-cell">
            <div class="order-label">${o.orderType === 'market' ? 'Type' : 'Limit'}</div>
            <div class="order-value">${o.orderType === 'market' ? 'Market' : '$' + fmt(o.limitPrice)}</div>
          </div>
          <div class="order-cell">
            <div class="order-label">${o.status === 'filled' ? 'Filled @' : 'Status'}</div>
            <div class="order-value">${o.filledPrice ? '$' + fmt(o.filledPrice) : (o.status === 'pending' ? 'Waiting' : '—')}</div>
          </div>
        </div>
        ${o.status === 'pending' || o.status === 'partially_filled' ? `<button class="cancel-btn" onclick="cancelOrder('${o._id}', this)">Cancel order</button>` : ''}
      </div>
    `;
  }).join('');
}

async function cancelOrder(orderId, btn){
  btn.disabled = true;
  btn.textContent = 'Cancelling…';
  try {
    const r = await fetch('/api/buy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'order-cancel', orderId })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Cancel failed');
    toast('Order cancelled', 'success');
    setTimeout(loadOrders, 500);
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Cancel order';
  }
}

// Tab switching
document.querySelectorAll('.seg').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seg').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    loadOrders();
  });
});

loadOrders();
// Refresh every 30 s
setInterval(() => { if (!document.hidden) loadOrders(); }, 30000);
</script>
</body>
</html>
